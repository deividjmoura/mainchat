name: Foundation quality gate

on:
  push:
    branches: [feat/scrollytelling-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Validate scene structure
        run: pnpm check:structure
      - name: Validate shaders
        run: pnpm check:glsl
      - name: Validate geometry and transitions
        run: pnpm check:geometry
      - name: Validate scene timelines
        run: pnpm check:logic
      - name: Production build
        run: pnpm build
