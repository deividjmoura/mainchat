<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeuCérebro — Chat com IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e10; --bg2: #18181c; --bg3: #222228; --bg4: #2a2a32;
    --t1: #f0f0f4; --t2: #9090a0; --t3: #55555f;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --accent: #5b8fff; --accent-bg: rgba(91,143,255,0.12); --accent-text: #8ab4ff;
    --success: #3ecf8e; --success-bg: rgba(62,207,142,0.1);
    --warn: #facc15; --warn-bg: rgba(250,204,21,0.1);
    --danger: #f87171; --danger-bg: rgba(248,113,113,0.1);
    --radius: 12px; --radius-sm: 7px;
    --font: 'IBM Plex Sans', sans-serif; --mono: 'IBM Plex Mono', monospace;
  }
  html, body { height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--t1); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
  #app { width: 100%; max-width: 720px; height: calc(100vh - 32px); max-height: 860px; display: flex; flex-direction: column; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; position: relative; }

  /* Header */
  #header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #header-left { display: flex; align-items: center; gap: 11px; }
  #logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent-bg); border: 1px solid rgba(91,143,255,0.25); display: flex; align-items: center; justify-content: center; }
  #logo i { font-size: 16px; color: var(--accent-text); }
  #title { font-size: 14px; font-weight: 500; color: var(--t1); }
  #subtitle { font-size: 11px; color: var(--t3); margin-top: 1px; }
  #header-right { display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; display: flex; align-items: center; gap: 4px; font-weight: 500; }
  .badge.ok { background: var(--success-bg); color: var(--success); }
  .badge.loading { background: var(--warn-bg); color: var(--warn); }
  .badge.error { background: var(--danger-bg); color: var(--danger); }
  #btn-settings { background: transparent; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 6px 10px; cursor: pointer; color: var(--t2); font-size: 12px; font-family: var(--font); display: flex; align-items: center; gap: 5px; transition: background 0.15s, color 0.15s; }
  #btn-settings:hover { background: var(--bg3); color: var(--t1); }

  /* Toolbar */
  #toolbar { display: flex; align-items: center; gap: 8px; padding: 9px 18px; border-bottom: 1px solid var(--border); background: var(--bg); flex-shrink: 0; }
  #toolbar label { font-size: 11px; color: var(--t3); white-space: nowrap; }
  #model-select { flex: 1; font-size: 12px; font-family: var(--font); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 5px 9px; background: var(--bg2); color: var(--t1); cursor: pointer; outline: none; }
  #model-select:focus { border-color: var(--accent); }
  #btn-clear { background: transparent; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 5px 10px; font-size: 11px; font-family: var(--font); color: var(--t2); cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; transition: background 0.15s, color 0.15s; }
  #btn-clear:hover { background: var(--bg3); color: var(--t1); }
  #btn-reload-vault { background: transparent; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 5px 8px; font-size: 11px; font-family: var(--font); color: var(--t2); cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; transition: background 0.15s, color 0.15s; }
  #btn-reload-vault:hover { background: var(--bg3); color: var(--t1); }

  /* Messages */
  #messages { flex: 1; overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; scrollbar-color: var(--bg4) transparent; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }
  .sys-msg { text-align: center; font-size: 11px; color: var(--t3); padding: 2px 0; }
  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; font-family: var(--mono); }
  .avatar.ai { background: var(--accent-bg); color: var(--accent-text); border: 1px solid rgba(91,143,255,0.2); }
  .avatar.user { background: var(--bg3); color: var(--t2); border: 1px solid var(--border); }
  .msg-body { display: flex; flex-direction: column; gap: 4px; max-width: 78%; }
  .msg.user .msg-body { align-items: flex-end; }
  .bubble { padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.65; color: var(--t1); }
  .msg.ai .bubble { background: var(--bg3); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.user .bubble { background: var(--accent-bg); border: 1px solid rgba(91,143,255,0.2); color: var(--accent-text); border-top-right-radius: 4px; }
  .bubble p { margin: 0 0 6px; }
  .bubble p:last-child { margin: 0; }
  .bubble strong { font-weight: 500; color: var(--t1); }
  .bubble em { font-style: italic; color: var(--t2); }
  .bubble code { font-family: var(--mono); font-size: 12px; background: var(--bg4); padding: 1px 5px; border-radius: 4px; color: #c9d1d9; }
  .bubble pre { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin: 8px 0; overflow-x: auto; }
  .bubble pre code { background: none; padding: 0; font-size: 12px; }
  .bubble ul, .bubble ol { padding-left: 18px; margin: 4px 0 8px; }
  .bubble li { margin-bottom: 3px; }
  .msg-time { font-size: 10px; color: var(--t3); }
  .thinking { display: flex; align-items: center; gap: 7px; padding: 6px 0; }
  .dots { display: flex; gap: 4px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--t3); animation: pulse 1.4s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,80%,100%{opacity:0.2;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }
  .thinking-label { font-size: 11px; color: var(--t3); font-family: var(--mono); }

  /* Input */
  #input-area { border-top: 1px solid var(--border); padding: 12px 18px; display: flex; gap: 8px; align-items: flex-end; background: var(--bg2); flex-shrink: 0; }
  #msg-input { flex: 1; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 13px; font-size: 13px; font-family: var(--font); color: var(--t1); background: var(--bg); resize: none; min-height: 40px; max-height: 120px; line-height: 1.5; outline: none; transition: border-color 0.15s; }
  #msg-input:focus { border-color: var(--accent); }
  #msg-input::placeholder { color: var(--t3); }
  #btn-send { width: 40px; height: 40px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.15s, transform 0.1s; }
  #btn-send:hover { opacity: 0.85; }
  #btn-send:active { transform: scale(0.95); }
  #btn-send:disabled { opacity: 0.3; cursor: not-allowed; }
  #btn-send i { font-size: 18px; }

  /* Settings */
  #settings-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 20; align-items: center; justify-content: center; }
  #settings-overlay.open { display: flex; }
  #settings-panel { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 20px; width: 340px; max-width: calc(100vw - 32px); }
  #settings-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  #settings-header h3 { font-size: 14px; font-weight: 500; color: var(--t1); }
  #btn-close-settings { background: none; border: none; cursor: pointer; color: var(--t2); font-size: 18px; display: flex; align-items: center; }
  #btn-close-settings:hover { color: var(--t1); }
  .field { margin-bottom: 12px; }
  .field label { font-size: 11px; color: var(--t2); display: block; margin-bottom: 5px; }
  .field input, .field textarea { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 8px 11px; font-size: 12px; font-family: var(--font); color: var(--t1); outline: none; transition: border-color 0.15s; }
  .field textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field input::placeholder, .field textarea::placeholder { color: var(--t3); }
  #btn-save { width: 100%; padding: 9px; font-size: 13px; font-family: var(--font); font-weight: 500; margin-top: 4px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); cursor: pointer; transition: opacity 0.15s; }
  #btn-save:hover { opacity: 0.85; }
  .settings-note { font-size: 10px; color: var(--t3); margin-top: 10px; line-height: 1.6; }

  @media (max-width: 480px) {
    body { padding: 0; }
    #app { height: 100vh; max-height: none; border-radius: 0; border: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-left">
      <div id="logo"><i class="ti ti-brain"></i></div>
      <div>
        <div id="title">MeuCérebro</div>
        <div id="subtitle">chat com memória</div>
      </div>
    </div>
    <div id="header-right">
      <div id="vault-status" class="badge error"><i class="ti ti-alert-circle"></i> sem credenciais</div>
      <button id="btn-settings"><i class="ti ti-settings"></i> config</button>
    </div>
  </div>

  <div id="toolbar">
    <label for="model-select">Modelo</label>
    <select id="model-select">
      <optgroup label="Groq — gratuito e rápido">
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B — melhor qualidade</option>
        <option value="llama-3.1-8b-instant">Llama 3.1 8B — mais rápido</option>
        <option value="openai/gpt-oss-120b">GPT-OSS 120B — raciocínio avançado</option>
      </optgroup>
    </select>
    <button id="btn-reload-vault" title="Recarregar vault"><i class="ti ti-refresh"></i></button>
    <button id="btn-clear"><i class="ti ti-trash"></i> limpar</button>
  </div>

  <div id="messages">
    <div class="sys-msg">Clique em <strong>config</strong> para inserir suas chaves e conectar a vault</div>
  </div>

  <div id="input-area">
    <textarea id="msg-input" placeholder="Digite sua mensagem... (Enter para enviar, Shift+Enter para nova linha)" rows="1"></textarea>
    <button id="btn-send"><i class="ti ti-arrow-up"></i></button>
  </div>

  <div id="settings-overlay">
    <div id="settings-panel">
      <div id="settings-header">
        <h3><i class="ti ti-settings" style="margin-right:6px"></i>Configurações</h3>
        <button id="btn-close-settings"><i class="ti ti-x"></i></button>
      </div>
      <div class="field">
        <label for="inp-groq">Groq API Key</label>
        <input type="password" id="inp-groq" placeholder="gsk_...">
      </div>
      <div class="field">
        <label for="inp-gh-token">GitHub Token (para vault)</label>
        <input type="password" id="inp-gh-token" placeholder="ghp_...">
      </div>
      <div class="field">
        <label for="inp-gist-id">Gist ID da vault</label>
        <input type="text" id="inp-gist-id" placeholder="98d6f44...">
      </div>
      <div class="field">
        <label for="inp-system">Contexto extra (opcional)</label>
        <textarea id="inp-system" placeholder="Ex: Meu nome é Deivid, moro em Penha/SC, trabalho com tecnologia..."></textarea>
      </div>
      <button id="btn-save">Salvar e conectar vault</button>
      <div class="settings-note">As chaves ficam salvas apenas no seu navegador (localStorage) e nunca são enviadas a terceiros além dos próprios provedores de IA.</div>
    </div>
  </div>
</div>

<script>
const GROQ_URL = 'https://api.groq.com/openai/v1/chat/completions';
const GIST_URL = 'https://api.github.com/gists/';

let cfg = { groqKey: '', ghToken: '', gistId: '', systemPrompt: '' };
let vaultContent = '';
let history = [];
let isLoading = false;

function loadCfg() {
  try { const s = localStorage.getItem('meucerebro_cfg'); if (s) cfg = { ...cfg, ...JSON.parse(s) }; } catch(e) {}
}
function saveCfg() { localStorage.setItem('meucerebro_cfg', JSON.stringify(cfg)); }

function setVaultStatus(state, text) {
  const el = document.getElementById('vault-status');
  el.className = 'badge ' + (state === 'ok' ? 'ok' : state === 'error' ? 'error' : 'loading');
  const icon = state === 'ok' ? 'check' : state === 'error' ? 'alert-circle' : 'loader';
  el.innerHTML = `<i class="ti ti-${icon}"></i> ${text}`;
}

async function loadVault() {
  if (!cfg.ghToken || !cfg.gistId) { setVaultStatus('error', 'sem credenciais'); return; }
  setVaultStatus('loading', 'carregando...');
  try {
    const r = await fetch(GIST_URL + cfg.gistId, { headers: { Authorization: 'token ' + cfg.ghToken, Accept: 'application/vnd.github.v3+json' } });
    if (!r.ok) throw new Error('status ' + r.status);
    const data = await r.json();
    const files = Object.values(data.files);
    vaultContent = files.map(f => f.content).join('\n\n');
    setVaultStatus('ok', `vault ok (${files.length} arquivo${files.length > 1 ? 's' : ''})`);
    addSysMsg(`Vault carregada — ${files.length} arquivo(s) na memória.`);
  } catch(e) {
    setVaultStatus('error', 'erro na vault');
    addSysMsg('Erro ao carregar vault: ' + e.message);
  }
}

function buildSystemPrompt() {
  const base = cfg.systemPrompt
    ? cfg.systemPrompt
    : 'Você é MeuCérebro, assistente pessoal. Responda em português brasileiro.';
  const MAX = 2000;
  let vault = vaultContent || '';
  if (vault.length > MAX) vault = vault.slice(0, MAX) + '\n[vault truncada]';
  const vaultSection = vault ? `\n\n## MEMÓRIA (Vault Obsidian)\nUse para responder sobre histórico pessoal do usuário.\n--- VAULT ---\n${vault}\n--- FIM ---` : '';
  return base + vaultSection;
}

function addSysMsg(text) {
  const el = document.createElement('div');
  el.className = 'sys-msg';
  el.textContent = text;
  document.getElementById('messages').appendChild(el);
  scrollBottom();
}

function fmt(text) {
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code>${code.trim().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre>`);
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
  text = text.replace(/^### (.+)$/gm, '<strong>$1</strong>');
  text = text.replace(/^## (.+)$/gm, '<strong>$1</strong>');
  text = text.replace(/^- (.+)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
  text = text.replace(/\n/g, '<br>');
  return text;
}

function addMsg(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const av = document.createElement('div');
  av.className = 'avatar ' + role;
  av.textContent = role === 'ai' ? 'AI' : 'EU';
  const body = document.createElement('div');
  body.className = 'msg-body';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.innerHTML = fmt(text);
  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  body.appendChild(bub);
  body.appendChild(time);
  wrap.appendChild(av);
  wrap.appendChild(body);
  document.getElementById('messages').appendChild(wrap);
  scrollBottom();
}

function showThinking() {
  const el = document.createElement('div');
  el.className = 'msg ai';
  el.id = 'thinking-msg';
  el.innerHTML = `<div class="avatar ai">AI</div><div class="thinking"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><span class="thinking-label">pensando...</span></div>`;
  document.getElementById('messages').appendChild(el);
  scrollBottom();
}
function removeThinking() { const el = document.getElementById('thinking-msg'); if (el) el.remove(); }
function scrollBottom() { const m = document.getElementById('messages'); m.scrollTop = m.scrollHeight; }

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  if (!cfg.groqKey) { addSysMsg('Configure sua Groq API Key em config.'); return; }

  input.value = '';
  input.style.height = 'auto';
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  isLoading = true;
  document.getElementById('btn-send').disabled = true;
  showThinking();

  const model = document.getElementById('model-select').value;
  const systemMsg = buildSystemPrompt();

  const callAPI = async (retries = 2) => {
    const r = await fetch(GROQ_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.groqKey },
      body: JSON.stringify({ model, messages: [{ role: 'system', content: systemMsg }, ...history], max_tokens: 800, temperature: 0.7 })
    });
    if (r.status === 429 && retries > 0) {
      const err = await r.json();
      const msg = err.error?.message || '';
      const wait = parseFloat((msg.match(/try again in ([\d.]+)s/) || [])[1] || '5') * 1000;
      document.getElementById('thinking-msg').querySelector('.thinking-label').textContent = `aguardando ${Math.ceil(wait/1000)}s (rate limit)...`;
      await new Promise(res => setTimeout(res, wait + 500));
      return callAPI(retries - 1);
    }
    if (!r.ok) { const e = await r.json(); throw new Error(e.error?.message || 'erro ' + r.status); }
    return r.json();
  };
  try {
    const data = await callAPI();
    const reply = data.choices?.[0]?.message?.content || '(sem resposta)';
    removeThinking();
    addMsg('ai', reply);
    history.push({ role: 'assistant', content: reply });
  } catch(e) {
    removeThinking();
    addMsg('ai', 'Erro: ' + e.message);
  }
  isLoading = false;
  document.getElementById('btn-send').disabled = false;
  input.focus();
}

document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('msg-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
document.getElementById('btn-send').addEventListener('click', sendMessage);
document.getElementById('btn-reload-vault').addEventListener('click', loadVault);
document.getElementById('btn-settings').addEventListener('click', () => {
  document.getElementById('inp-gist-id').value = cfg.gistId || '';
  document.getElementById('inp-system').value = cfg.systemPrompt || '';
  document.getElementById('settings-overlay').classList.add('open');
});
document.getElementById('btn-close-settings').addEventListener('click', () => {
  document.getElementById('settings-overlay').classList.remove('open');
});
document.getElementById('settings-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('settings-overlay'))
    document.getElementById('settings-overlay').classList.remove('open');
});
document.getElementById('btn-save').addEventListener('click', () => {
  const groq = document.getElementById('inp-groq').value.trim();
  const gh = document.getElementById('inp-gh-token').value.trim();
  if (groq) cfg.groqKey = groq;
  if (gh) cfg.ghToken = gh;
  cfg.gistId = document.getElementById('inp-gist-id').value.trim() || cfg.gistId;
  cfg.systemPrompt = document.getElementById('inp-system').value.trim();
  saveCfg();
  document.getElementById('settings-overlay').classList.remove('open');
  loadVault();
});
document.getElementById('btn-clear').addEventListener('click', () => {
  history = [];
  document.getElementById('messages').innerHTML = '';
  addSysMsg('Conversa limpa. Vault mantida na memória.');
});

loadCfg();
if (cfg.ghToken && cfg.gistId) loadVault();
else setVaultStatus('error', 'sem credenciais');
</script>
</body>
</html>
